# derisk-v2.1 (pad_batchmax): derisk-v1 pad_batchmax with random padding tokens.
# Differs from experiments/derisk-v1/configs/pad_batchmax.yaml only in the collate_fn (random pad token ids)
# and the run names / output paths (check_configs.py enforces this).
# Run: bash experiments/derisk-v2/run_v2.sh v21_pad_batchmax_randpad v21_pad_batchmax_randpad

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 128
  # 4 per GPU ran out of memory in pad_fixed8192 (the GPU hosting the pad-token experts), so both arms use 2.
  local_batch_size: 2 # 128 / (2 per GPU * 8 GPUs) = 8 micro-batches per step
  max_steps: 20 # 20 * 128 = 2560 = the whole sampled subset, each sample seen once
  ckpt_every_steps: 1000000
  val_every_steps: 1000000
  gc_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  trust_remote_code: true
  # FusedLinearCrossEntropy consumes the final hidden state instead of full [batch, seq, vocab] logits.
  output_hidden_states: true
  # Repo defaults, spelled out so both arms are pinned to the same kernels.
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true

checkpoint:
  enabled: false
  # Checkpoints are never written; training.jsonl is logged here.
  checkpoint_dir: experiments/derisk-v2/runs/v21_pad_batchmax_randpad/checkpoint

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8 # 128 routed experts -> 16 experts per GPU
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  # shuffle_seed shuffles the full train split before slicing, so this is a random 2560-row subset.
  split: "train[:2560]"
  shuffle_seed: 42
  seq_length: 4096
  truncation: true
  padding: do_not_pad

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  # The subset is already shuffled; a fixed order keeps micro-batches identical across arms.
  shuffle: false
  num_workers: 4
  collate_fn:
    _target_: random_pad.random_pad_collater
    # Pad to the longest sequence in each micro-batch (as in derisk-v1 pad_batchmax), then fill the
    # padding positions with random ordinary tokens (ids 1000-131071) instead of <|im_end|>.
    low: 1000
    high: 131072
    seed: 1234

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

mfu:
  peak_tflops: 989 # H100 SXM dense BF16

wandb:
  project: derisk-v2
  group: v2.1-random-pad
  name: v21_pad_batchmax_randpad
  tags: [nemotron-nano-3, tulu3, padding, mfu, ep8]
  dir: experiments/derisk-v2/runs/v21_pad_batchmax_randpad

probe:
  output_dir: experiments/derisk-v2/runs/v21_pad_batchmax_randpad
  # Pad tokens are bucketed by distance from the last real token: [0], [1,8), [8,64), [64,512), [512,4096), [4096,inf).
  pad_distance_edges: [1, 8, 64, 512, 4096]
  # nsys capture window (0-based step indices, inclusive); -1 disables. See profile_nsys.sh.
  nsys_start_step: -1
  nsys_end_step: -1
  nsys_ranks: [0]
