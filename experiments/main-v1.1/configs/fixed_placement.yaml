# main-v1.1, padding setting "fixed", method "placement".
#
# Identical to experiments/main-v1/configs/fixed_placement.yaml except for what main-v1.1 changes (check_configs.py
# enforces this): LoRA instead of full-parameter training (peft block), experts split over 4 GPUs instead
# of 8 (distributed.ep_size), Adam on the LoRA weights (optimizer), the wandb project, and output paths.
# run_all.sh runs it on GPUs 4-7 with 4 processes; the data and code are main-v1's.
#   bash experiments/main-v1.1/run_one.sh fixed_placement fixed_placement

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2 # 128 / (2 per GPU * 4 GPUs) = 16 micro-batches per GPU per step
  max_steps: 40 # 40 * 128 = 5,120 = the whole training subset, each conversation seen once
  ckpt_every_steps: 1000000
  val_every_steps: 1000000
  gc_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  trust_remote_code: true
  # FusedLinearCrossEntropy consumes the final hidden state instead of full [batch, seq, vocab] logits.
  output_hidden_states: true
  # Repo defaults, spelled out so every run is pinned to the same kernels.
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true

checkpoint:
  enabled: false
  # Checkpoints are never written; training.jsonl is logged here.
  checkpoint_dir: experiments/main-v1.1/runs/fixed_placement/checkpoint

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  # AutoModel's Nemotron Nano V3 LoRA settings (examples/llm_finetune/nemotron/nemotron_nano_v3_hellaswag_peft_te.yaml).
  # Adapters go on standard linear layers (attention, Mamba in_proj, shared expert); the routed experts stay frozen.
  # Mamba out_proj is excluded because its custom kernel reads the weight directly. lm_head is excluded too:
  # FusedLinearCrossEntropy reads lm_head.weight directly and would bypass an adapter there.
  exclude_modules: ["*.out_proj", "lm_head"]
  dim: 8
  alpha: 32
  use_triton: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4 # 128 routed experts -> 32 experts per GPU
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  # 5,120 random conversations from nvidia/Nemotron-Instruction-Following-Chat-v1 (chat_if), already in a
  # fixed random order (prepare_data.py).
  path_or_dataset_id: experiments/main-v1/data/train.jsonl
  # Nano's chat template with {% generation %} markers (make_chat_template.py): identical text, and the
  # assistant-only loss mask works for multi-turn conversations with reasoning.
  chat_template: experiments/main-v1/templates/nano3_generation.jinja
  seq_length: 8192
  truncation: true
  padding: do_not_pad

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  # train.jsonl is already shuffled; a fixed order keeps every micro-batch identical across runs.
  shuffle: false
  num_workers: 4
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    # Round every micro-batch up to a multiple of 8,192. No conversation is longer after truncation, so
    # every micro-batch becomes exactly [2, 8192].
    pad_seq_len_divisible: 8192

optimizer:
  # As in AutoModel's Nemotron Nano V3 LoRA example; only the LoRA weights are trained.
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

mfu:
  peak_tflops: 989 # H100 SXM dense BF16

wandb:
  project: main-v1.1
  group: fixed
  name: fixed_placement
  tags: [nemotron-nano-3, ifchat, padding, mfu, ep4, lora]
  dir: experiments/main-v1.1/runs/fixed_placement

expert_placement:
  # Per-layer expert-to-GPU placement computed by run_all.sh from the router counts of the fixed_default
  # run on this same data (expert_placement.py). Calibrated and evaluated on the same data: a best case.
  path: experiments/main-v1.1/placements/fixed.json

probe:
  output_dir: experiments/main-v1.1/runs/fixed_placement
  # Pad tokens are bucketed by distance from the last real token: [0], [1,8), [8,64), [64,512), [512,4096), [4096,inf).
  pad_distance_edges: [1, 8, 64, 512, 4096]
  summary_warmup_steps: 2
  # nsys capture window (0-based step indices, inclusive); -1 disables. See profile_nsys.sh.
  nsys_start_step: -1
  nsys_end_step: -1
  nsys_ranks: [0]
