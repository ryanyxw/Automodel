# profiling-v1 `baseline`: padding holds <|im_end|> (AutoModel's default collate function), hidden from attention and Mamba (derisk-v1 pad_fixed8192).
# derisk's pad-fixed8192 setup (Tulu-3, every micro-batch [2, 8192]) moved to 4 GPUs (EP=4) with plain SGD,
# because Adam's state does not fit on 4 GPUs. The three configs differ only in the collate_fn and the
# run name / output paths (check_configs.py enforces this).
# Run: bash experiments/profiling-v1/run.sh mfu baseline    |    bash experiments/profiling-v1/run.sh nsys baseline

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2 # 128 / (2 per GPU * 4 GPUs) = 16 micro-batches per step
  max_steps: 20 # 20 * 128 = 2560 = the whole sampled subset, each sample seen once
  ckpt_every_steps: 1000000
  val_every_steps: 1000000
  gc_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  trust_remote_code: true
  # FusedLinearCrossEntropy consumes the final hidden state instead of full [batch, seq, vocab] logits.
  output_hidden_states: true
  # Repo defaults, spelled out so every config is pinned to the same kernels.
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true

checkpoint:
  enabled: false
  # Checkpoints are never written; training.jsonl is logged here.
  checkpoint_dir: experiments/profiling-v1/runs/baseline/checkpoint

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4 # 128 routed experts -> 32 experts per GPU
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  # shuffle_seed shuffles the full train split before slicing, so this is a random 2560-row subset.
  split: "train[:2560]"
  shuffle_seed: 42
  seq_length: 4096
  truncation: true
  padding: do_not_pad

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  # The subset is already shuffled; a fixed order keeps micro-batches identical across arms.
  shuffle: false
  num_workers: 4
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    # Round every micro-batch up to a multiple of 8192. All sequences are shorter than 4096 tokens
    # after truncation, so every micro-batch becomes exactly [2, 8192].
    pad_seq_len_divisible: 8192

optimizer:
  # Plain SGD (no momentum, no fp32 master weights): no optimizer state, so full fine-tuning fits on 4 GPUs.
  # Forward, backward and expert routing are unchanged; only the (short) optimizer step differs from Adam.
  _target_: torch.optim.SGD
  lr: 1.0e-5
  momentum: 0.0
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

mfu:
  peak_tflops: 989 # H100 SXM dense BF16

probe:
  output_dir: experiments/profiling-v1/runs/baseline
  # Pad tokens are bucketed by distance from the last real token: [0], [1,8), [8,64), [64,512), [512,4096), [4096,inf).
  pad_distance_edges: [1, 8, 64, 512, 4096]
  # nsys capture window (0-based step indices, inclusive); -1 disables. run.sh nsys sets them.
  nsys_start_step: -1
  nsys_end_step: -1
  nsys_ranks: [0]

profile:
  # NVTX ranges per MoE layer and phase (moe_nvtx.py); run.sh nsys turns them on, the MFU runs keep them off.
  moe_nvtx: false
